[project]
name = "obdschat"
version = "0.1.0"
description = "Source-grounded chat for the German oBDS"
readme = "README.md"
requires-python = ">=3.13.9"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "gradio>=6.22.0",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "openai>=2.53.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "uvicorn>=0.52.1",
    "xmlschema>=4.3.2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
