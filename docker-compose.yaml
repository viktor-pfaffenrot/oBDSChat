name: obdschat

networks:
  obdschat-network:
    driver: bridge

secrets:
  obdschat_db_password:
    file: ${OBDSCHAT_BASE_DIR}/config/secrets/obdschat_db_password.txt


services:
  obdschat-db:
    image: postgres:18
    container_name: oBDSChat_postgres_db
    restart: unless-stopped #on-failure:5 #unless-stopped
    environment:
      POSTGRES_USER: ${OBDSCHAT_DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/obdschat_db_password
      POSTGRES_DB: ${OBDSCHAT_DB_NAME}
      TZ: ${OBDSCHAT_TZ}
    secrets:
      - obdschat_db_password
    volumes:
      # Init script to create extra users using secrets
      #- ./postgres/init-users.sh:/docker-entrypoint-initdb.d/init-users.sh:ro
      - ${OBDSCHAT_INIT_DATA}:/docker-entrypoint-initdb.d
      # Persist entire /var/lib/postgresql so Postgres 18+ can manage subdirectories
      - ${OBDSCHAT_BASE_DIR}/data/obdschat_db/data:/var/lib/postgresql
      - ${OBDSCHAT_BASE_DIR}/data/obdschat_db/logs:/var/log/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -p 5432",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${OBDSCHAT_DB_PORT}:5432"
    security_opt:
      - no-new-privileges:true
    networks:
      - obdschat-network
