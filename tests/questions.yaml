# Evaluation question format
# ==========================
# This file is a YAML list. Add one list item per evaluation question.
#
# Required case fields:
# - id: Stable lowercase identifier using letters, digits, underscores, or hyphens.
# - category: One of field_meaning, allowed_values, datatype, cardinality,
#   xml_hierarchy, implementation_guidance, version, mixed_source, or
#   ambiguous_or_unanswerable.
# - question: German question sent unchanged to production.
# - facts: Facts expected in the answer. Each fact has:
#   - label: Human-readable result label.
#   - answer_any: Alternative valid phrases. Matching ignores case and punctuation;
#     multi-token phrases may contain extra words or use a different word order.
#     Keep alternatives short but distinctive and add common valid wording variants.
# - expected_source_types: Required cited source types. Supported values are xsd and
#   umsetzungsleitfaden. All listed types must be cited; extra official sources are OK.
#
# Optional case fields:
# - obds_version: Constrains production to one oBDS version.
# - expected_supported: Defaults to true. Set false when evidence cannot answer the
#   question; then use expected_source_types: [] and expect no citations.
#
# Example:
# - id: datatype-example
#   category: datatype
#   question: Welchen XSD-Datentyp hat Beispiel?
#   obds_version: 3.0.5
#   facts:
#     - label: Datentyp
#       answer_any: [xs:string, String-Typ]
#   expected_source_types: [xsd]

# Field meaning (9)
