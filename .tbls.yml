dsn: postgres://obdschat_docs:obdschat_docs@database:5432/obdschat_docs?sslmode=disable
docPath: docs/developer/database
name: oBDSChat PostgreSQL schema
desc: >
  Generated reference for the PostgreSQL data model used by oBDSChat source
  synchronization and search.

  Tables listed here are application-owned. ParadeDB extension enums may also
  appear because `pg_search` installs them in the same database.
requiredVersion: ">= 1.95, < 2"
disableOutputSchema: true

include:
  - public.documents

format:
  adjust: true
  sort: true
  hideColumnsWithoutValues: true

er:
  format: mermaid
  comment: true

lint:
  requireTableComment:
    enabled: true
  requireColumnComment:
    enabled: true
    allOrNothing: true
