site_name: oBDSChat documentation
site_description: User and developer documentation for oBDSChat
docs_dir: docs
site_dir: site

theme:
  name: readthedocs
  locale: en
  logo: assets/images/obdschat-logo-transparent.png

extra_css:
  - assets/stylesheets/readthedocs.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js
  - assets/javascripts/mermaid.js

plugins:
  - search
  - render_swagger

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - User documentation:
      - Use oBDSChat: user/how-to/use-obdschat.md
      - Configuration: user/reference/configuration.md
      - Troubleshoot: user/how-to/troubleshoot.md
  - Developer documentation:
      - System architecture: developer/explanation/system-architecture.md
      - Backend architecture: developer/explanation/backend-architecture.md
      - Frontend architecture: developer/explanation/frontend-architecture.md
      - Request and data flows: developer/explanation/request-data-flows.md
      - Data storage: developer/explanation/data-storage.md
      - Local development: developer/how-to/local-development.md
      - Extend the backend: developer/how-to/extend-backend.md
      - Change stored data: developer/how-to/change-stored-data.md
      - Test changes: developer/how-to/test-changes.md
  - REST API reference: developer/reference/rest-api.md
  - Database reference: developer/database/index.md
  - Operations:
      - Runtime configuration: developer/reference/runtime-configuration.md
      - Deploy and upgrade: developer/how-to/deploy.md
      - Logging and troubleshooting: developer/how-to/troubleshoot-operations.md
  - Architecture Decision Records:
      - Decisions and rationale: developer/explanation/ADR.md
  - License: license.md
